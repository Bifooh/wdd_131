<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeBook</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>

    <meta property="og:type" content="website">
    <meta property="og:title" content="RecipeBook">
    <meta property="og:description" content="Find easy and delicious recipes">
    <meta property="og:url" content="Your URL">
    <meta property="og:image" content="social-preview-image.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="RecipeBook">
    <meta name="twitter:description" content="Find easy and delicious recipes">
    <meta name="twitter:image" content="social-preview-image.png">

    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
</head>
<body>

    <header>
        <div id="hero">
            <img src="images_icons/recipe-book.png" alt="recipe book image">
            <h1>RecipeBook</h1>
        </div>

        <nav>
            <input id="search" type="text" placeholder="Find a recipe">
            <button id="sb">
                <img src="images_icons/search.svg" alt="search icon">
            </button>
        </nav>

        <hr>
    </header>
    
    <main></main>

    <footer>
        <div class="social">
            <a href="#"><img src="images_icons/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="images_icons/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="images_icons/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>                  
        
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>                   
    </footer>

</body>
</html>
